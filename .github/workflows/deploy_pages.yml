name: Deploy Final - GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build Flutter Web e Publicação em Produção
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Ambiente Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Dependências
        run: flutter pub get

      - name: Compilar Bundle Web de Produção
        run: flutter build web --release --base-href "/validade-zero-mvp/"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar Artefato Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publicar em Nuvem Pública (GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4